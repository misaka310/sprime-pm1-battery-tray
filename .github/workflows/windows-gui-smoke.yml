name: Windows GUI smoke

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-gui-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tray-ui-smoke:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Allow hosted taskbar time to refresh after relaunch
        shell: powershell
        run: |
          $path = 'tests/windows/tray_uia_smoke.py'
          $content = [IO.File]::ReadAllText($path)
          $pattern = '("SPRIME PM1 tray icon",\r?\n\s+lambda:[^\r\n]+,\r?\n\s+)timeout=8,'
          $updated = [regex]::Replace($content, $pattern, '${1}timeout=20,', 1)
          if ($updated -eq $content) {
            throw 'Expected tray wait block was not found.'
          }
          [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))
          python -m py_compile $path
          if ($LASTEXITCODE -ne 0) {
            throw 'Hosted taskbar timeout adaptation produced invalid Python.'
          }

      - name: Run packaged tray GUI smoke
        shell: powershell
        run: .\scripts\run-gui-smoke.ps1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-smoke-${{ github.run_id }}
          path: test-results/windows-gui-smoke
          if-no-files-found: ignore
          retention-days: 14
